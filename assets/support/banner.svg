</style><defs><radialGradient id="bgg" cx="20%" cy="0%" r="120%"><stop offset="0" stop-color="#142443"/><stop offset=".55" stop-color="#0a1122"/><stop offset="1" stop-color="#060a14"/></radialGradient><filter id="glow-c" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feFlood flood-color="#22d3ee" flood-opacity=".55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="1" y="1" width="818" height="168" rx="18" fill="url(#bgg)" stroke="#1e2b4a" stroke-width="2"/><rect class="pulse" x="1" y="1" width="818" height="168" rx="18" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-width="1.5"/><text x="410.0" y="58" text-anchor="middle" font-size="27" font-weight="700" fill="#e6edf7">Built &amp; maintained by one person in Việt Nam</text><text x="410.0" y="92" text-anchor="middle" font-size="17" fill="#a2b7d7">Một người Việt tự xây dựng và duy trì — miễn phí, mã nguồn mở</text><text x="410.0" y="134" text-anchor="middle" font-size="16" fill="#a2b7d7">Your support pays for: <tspan fill="#22d3ee" font-weight="600">new device support</tspan> · <tspan fill="#22d3ee" font-weight="600">faster fixes</tspan> · <tspan fill="#22d3ee" font-weight="600">every Home Assistant release</tspan></text></svg>
