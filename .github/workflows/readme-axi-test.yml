# Test của readme-axi: chạy CLI trên README mẫu tạm. Repo này public nên dùng GitHub Actions.
name: readme-axi tests

on:
  push:
    branches: [main]
    paths: [readme-axi/**, .github/workflows/readme-axi-test.yml]
  pull_request:
    paths: [readme-axi/**, .github/workflows/readme-axi-test.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: python -m unittest discover -s readme-axi -v
