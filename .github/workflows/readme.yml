# Workflow dùng chung: kiểm tra README song ngữ bằng readme-axi.
# Repo gọi: jobs.readme.uses: ngoviet/.github/.github/workflows/readme.yml@main
name: readme-axi

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tải readme-axi
        run: curl -fsSL https://raw.githubusercontent.com/ngoviet/.github/main/readme-axi/readme_axi.py -o "$RUNNER_TEMP/readme_axi.py"
      - name: Khung README
        run: python3 "$RUNNER_TEMP/readme_axi.py" check
      - name: Bản tiếng Việt có theo kịp không
        run: python3 "$RUNNER_TEMP/readme_axi.py" drift
